    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            rajdhani: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            paper: '#ffffff',
            alabaster: '#F0EFEA',
            gold: '#C5A028',
            'gold-light': '#F3E5AB',
            'gold-dark': '#8A7019',
            ink: '#0F0F0F',
            smoke: '#4a4a4a',
          },
          animation: {
            'fade-in': 'fadeIn 1.0s ease-out forwards',
            'slide-up': 'slideUp 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'grow-line': 'growLine 1.0s ease-out forwards',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'scroll-down': 'scrollDown 2s cubic-bezier(0.4, 0, 0.2, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translate3d(0, 20px, 0)', opacity: '0' },
              '100%': { transform: 'translate3d(0, 0, 0)', opacity: '1' },
            },
            growLine: {
              '0%': { transform: 'scaleX(0)' },
              '100%': { transform: 'scaleX(1)' },
            },
            scrollDown: {
              '0%': { transform: 'translate3d(0, -100%, 0)', opacity: '0' },
              '30%': { opacity: '1' },
              '70%': { opacity: '1' },
              '100%': { transform: 'translate3d(0, 100%, 0)', opacity: '0' },
            }
          }
        }
      }
    }

  <style>
    /* CORE STYLES & HARDWARE OPTIMIZATIONS */
    *, *::before, *::after {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0F0F0F;
      color: #0F0F0F;
      overflow-x: hidden;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    
    html {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    
    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .parallax-bg {
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transform: translateZ(0);
      will-change: transform;
    }
    
    @media screen and (max-width: 1024px), (pointer: coarse), (hover: none) {
      .parallax-bg {
        background-attachment: scroll !important;
        will-change: auto;
      }
    }

    /* GPU ACCELERATED MENU SYSTEM (NO RESIZE/REFLOW JANK) */
    .menu-trigger {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .menu-trigger.is-hidden {
      transform: scale(0.6);
      opacity: 0;
      pointer-events: none;
    }

    .menu-panel {
      display: none !important;
      width: min(calc(100vw - 2.5rem), 380px);
      height: min(85vh, 620px);
      max-height: calc(100svh - 2.5rem);
      transform-origin: top right;
      transform: translate3d(0, 0, 0) scale(0.25);
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      -webkit-perspective: 1000px;
      perspective: 1000px;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.08);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.38s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .menu-panel.is-open {
      display: flex !important;
    }

    .menu-panel.is-visible {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    .menu-overlay {
      display: none !important;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      will-change: opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .menu-overlay.is-active {
      display: block !important;
    }

    .menu-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    .menu-nav-btn {
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Subpixel smoothing in Safari & Chrome */
    .menu-panel * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ACCORDION GPU OPTIMIZATION */
    .set-item-content {
      will-change: max-height, opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* MODAL GPU OPTIMIZATION */
    #info-modal {
      will-change: opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    #info-modal-content {
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Disable body scroll when menu is active */
    body.scroll-locked {
      overflow: hidden !important;
      touch-action: none !important;
      -webkit-overflow-scrolling: auto !important;
    }

    .icon-filter-gold {
      filter: invert(76%) sepia(35%) saturate(859%) hue-rotate(5deg) brightness(92%) contrast(85%);
    }
    .icon-filter-white {
      filter: brightness(0) invert(1);
    }
    .group:hover .group-hover\:icon-filter-gold {
      filter: invert(76%) sepia(35%) saturate(859%) hue-rotate(5deg) brightness(92%) contrast(85%);
    }
  </style>

            const isLast = idx === _0x4f21.length - 1;
            
            const renderItem = (item, dark = false) => {
                if(isSets) {
                    return `
                    <div class="border-b border-gray-200 last:border-0">
                        <div onclick="toggleItem(this)" class="flex items-center justify-between py-6 cursor-pointer">
                            <div class="flex flex-col">
                                <span class="item-title font-cinzel font-extrabold text-xl md:text-2xl transition-colors duration-300 text-ink">
                                    ${item.name[currentLang]}
                                </span>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="font-rajdhani font-bold text-gold-dark text-lg md:text-xl">${item.price}</span>
                                <span class="arrow text-gray-300 transform transition-transform duration-500">▼</span>
                            </div>
                        </div>
                        <div class="set-item-content overflow-hidden transition-all duration-700 ease-[cubic-bezier(0.25,1,0.5,1)] max-h-0 opacity-0">
                            <div class="flex flex-col items-start pt-2 px-4 border-l-2 border-gold/30 ml-2">
                                <h4 class="font-cinzel text-gold text-xs tracking-[0.2em] uppercase mb-3 inline-block">
                                    ${UI_TEXT.description_label[currentLang]}
                                </h4>
                                <p class="font-rajdhani text-gray-600 text-lg md:text-xl leading-relaxed whitespace-pre-line font-medium">
                                    ${item.desc[currentLang]}
                                </p>
                            </div>
                        </div>
                    </div>`;
                } else {
                    return `
                    <div class="py-6 border-b ${dark ? 'border-white/10' : 'border-gray-100'} last:border-0 px-4 -mx-4 rounded-xl">
                        <div class="flex justify-between items-baseline gap-4 mb-2">
                            <h3 class="font-cinzel text-xl ${dark ? 'text-white' : 'text-ink'} font-extrabold tracking-wide">
                                ${item.name[currentLang]}
                            </h3>
                            <span class="font-rajdhani font-bold ${dark ? 'text-gold' : 'text-gold-dark'} text-lg whitespace-nowrap">
                                ${item.price}
                            </span>
                        </div>
                        <p class="font-rajdhani ${dark ? 'text-gray-400' : 'text-gray-500'} text-base leading-relaxed max-w-3xl whitespace-pre-line">
                            ${item.desc[currentLang]}
                        </p>
                    </div>`;
                }
            };

            if (isSpecials) {
                return `
                <section id="${section.id}" class="w-full relative z-30 pt-10 pb-32 px-6">
                    <div class="max-w-4xl mx-auto text-center mb-16">
                        <div class="flex items-center justify-center gap-4 mb-6">
                            <div class="h-[1px] w-12 bg-gold/50"></div>
                            <span class="block font-cinzel text-gold text-lg md:text-xl tracking-[0.4em]">${idx < 9 ? '0' : ''}${idx + 1}</span>
                            <div class="h-[1px] w-12 bg-gold/50"></div>
                        </div>
                        <h2 class="font-cinzel text-4xl md:text-6xl text-white font-bold tracking-widest uppercase mb-6 drop-shadow-lg">
                            ${section.title[currentLang]}
                        </h2>
                        <p class="font-rajdhani text-lg md:text-xl max-w-2xl mx-auto text-gray-300 font-light">
                            ${section.desc[currentLang]}
                        </p>
                    </div>
                    <div class="max-w-4xl mx-auto flex flex-col">
                        ${section.items.map(item => renderItem(item, true)).join('')}
                    </div>
                </section>
                `;
            }

            let contentHTML = '';
            if(section.isSplit) {
                contentHTML = `
                <div class="space-y-20">
                    <div>
                        <h3 class="text-center font-cinzel text-2xl text-gold mb-12 tracking-widest">${UI_TEXT.uramaki_title[currentLang]}</h3>
                        <div class="flex flex-col">
                            ${section.items.map(item => renderItem(item, false)).join('')}
                        </div>
                    </div>
                    <div>
                        <h3 class="text-center font-cinzel text-2xl text-gold mb-12 tracking-widest">${UI_TEXT.tempura_title[currentLang]}</h3>
                        <div class="flex flex-col">
                            ${section.itemsRight ? section.itemsRight.map(item => renderItem(item, false)).join('') : ''}
                        </div>
                    </div>
                </div>`;
            } else {
                contentHTML = `<div class="flex flex-col">${section.items.map(item => renderItem(item, false)).join('')}</div>`;
            }

            return `
            <section id="${section.id}" class="mb-0 w-full bg-white relative">
                <div class="w-full h-[60svh] md:h-[80svh] relative flex items-center justify-center overflow-hidden bg-ink">
                    <div class="absolute inset-0 z-20"></div>
                    ${section.img ? `<div class="absolute inset-0 parallax-bg" style="background-image: url('${section.img}')"></div>` : `<div class="absolute inset-0 bg-gradient-to-b from-ink via-[#1a1a1a] to-ink"></div>`}
                    <div class="absolute inset-0 bg-black/40 pointer-events-none"></div>
                    
                    <div class="relative z-30 text-center text-white px-4">
                        <span class="block font-cinzel text-gold text-lg md:text-xl tracking-[0.4em] mb-4">${idx < 9 ? '0' : ''}${idx + 1}</span>
                        <h2 class="font-cinzel text-5xl md:text-8xl font-bold tracking-widest uppercase mb-6 drop-shadow-lg">
                            ${section.title[currentLang]}
                        </h2>
                        <p class="font-rajdhani text-lg md:text-2xl max-w-2xl mx-auto text-gray-200 font-light">
                            ${section.desc[currentLang]}
                        </p>
                    </div>
                </div>

                <div class="max-w-5xl mx-auto px-6 py-20 md:py-32 bg-white relative -mt-10 rounded-t-3xl shadow-[0_-20px_60px_-15px_rgba(0,0,0,0.1)] z-20">
                    ${contentHTML}
                </div>
            </section>
            `;
        }).join('');

        const infoHTML = `
          <div class="bg-alabaster border-t border-gray-200 py-16 px-6 relative z-30">
              <div class="max-w-3xl mx-auto text-center">
                  <h4 class="font-cinzel text-gold-dark text-lg mb-4 tracking-widest uppercase">
                      ${ALLERGIES.title[currentLang]}
                  </h4>
                  <p class="font-rajdhani text-gray-600 text-sm leading-7 mb-8">
                      ${ALLERGIES.text[currentLang]}
                  </p>
              </div>
          </div>
        `;
      
        main.innerHTML = sectionsHTML + infoHTML;
    }
    })();
  </script>
</body>
