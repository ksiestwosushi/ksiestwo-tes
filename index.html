    let currentLang = 'pl';
    let isMenuExpanded = false;

    // INIT
    window.onload = function() {
      setTimeout(() => {
        document.getElementById('intro').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('intro').style.display = 'none';
            const langSel = document.getElementById('lang-select');
            langSel.style.pointerEvents = 'auto';
            langSel.style.opacity = '1';
        }, 1000);
      }, 1500);
      
      const panel = document.getElementById('menu-panel');
      const trigger = document.getElementById('menu-trigger');
      const closeBtn = document.getElementById('close-menu');

      // CLICK OUTSIDE LOGIC
      document.addEventListener('click', (e) => {
        if(isMenuExpanded) {
            if(panel && !panel.contains(e.target)) {
                toggleMenu(false);
            }
        }
      });

      setMenuState(false);

      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        if(!isMenuExpanded) toggleMenu(true);
      });

      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMenu(false);
      });

      window.scrollToSection = function(id) {
          const el = document.getElementById(id);
          if(el) {
              const yOffset = -80; 
              const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
              window.scrollTo({top: y, behavior: 'smooth'});
              if(isMenuExpanded) toggleMenu(false);
          }
      };

      window.setLanguage = function(lang) {
          currentLang = lang;
          const langSel = document.getElementById('lang-select');
          langSel.style.opacity = '0';
          setTimeout(() => {
            langSel.style.display = 'none';
            const app = document.getElementById('app');
            app.classList.remove('hidden');
            requestAnimationFrame(() => app.classList.remove('opacity-0'));
            renderApp();
          }, 700);
      };

      window.switchLang = function(lang) {
          currentLang = lang;
          renderApp();
      };

      window.openInfoModal = function() {
          const modal = document.getElementById('info-modal');
          const content = document.getElementById('info-modal-content');
          modal.classList.remove('hidden');
          requestAnimationFrame(() => {
              modal.classList.remove('opacity-0');
              content.classList.remove('scale-95');
          });
          document.getElementById('modal-title').textContent = ALLERGIES.title[currentLang];
          document.getElementById('modal-text').textContent = ALLERGIES.text[currentLang];
      };

      window.closeInfoModal = function() {
          const modal = document.getElementById('info-modal');
          const content = document.getElementById('info-modal-content');
          modal.classList.add('opacity-0');
          content.classList.add('scale-95');
          setTimeout(() => modal.classList.add('hidden'), 300);
      };
    };

    function setMenuState(expanded) {
        const panel = document.getElementById('menu-panel');
        const trigger = document.getElementById('menu-trigger');
        const content = document.getElementById('menu-content');

        if(expanded) {
            panel.style.width = 'min(90vw, 500px)'; 
            panel.style.height = '500px';
            panel.style.borderRadius = '32px'; 
            
            trigger.style.opacity = '0';
            trigger.style.pointerEvents = 'none';
            
            content.style.opacity = '1';
            content.style.pointerEvents = 'auto';
        } else {
            panel.style.width = '140px';
            panel.style.height = '50px';
            panel.style.borderRadius = '9999px'; 
            
            trigger.style.opacity = '1';
            trigger.style.pointerEvents = 'auto';
            
            content.style.opacity = '0';
            content.style.pointerEvents = 'none';
        }
    }

    function toggleMenu(expand) {
        isMenuExpanded = expand;
        setMenuState(expand);
    }

    function renderApp() {
        document.getElementById('hero-subtitle').textContent = UI_TEXT.hero_subtitle[currentLang];
        document.getElementById('hero-btn').textContent = UI_TEXT.explore_btn[currentLang];
        document.getElementById('footer-loc').textContent = UI_TEXT.location_label[currentLang];
        document.getElementById('footer-contact').textContent = UI_TEXT.contact_label[currentLang];
        document.getElementById('footer-country').textContent = UI_TEXT.poland[currentLang];

        const plBtns = document.querySelectorAll('.lang-btn-pl');
        const enBtns = document.querySelectorAll('.lang-btn-en');
        if(currentLang === 'pl') {
            plBtns.forEach(b => { b.classList.add('bg-gold', 'text-ink'); b.classList.remove('text-white/60'); });
            enBtns.forEach(b => { b.classList.remove('bg-gold', 'text-ink'); b.classList.add('text-white/60'); });
        } else {
            enBtns.forEach(b => { b.classList.add('bg-gold', 'text-ink'); b.classList.remove('text-white/60'); });
            plBtns.forEach(b => { b.classList.remove('bg-gold', 'text-ink'); b.classList.add('text-white/60'); });
        }

        const menuList = document.getElementById('menu-list');
        menuList.innerHTML = menuData.map(s => `
            <button onclick="scrollToSection('${s.id}')" class="text-left px-4 py-3 rounded-xl bg-white/5 hover:bg-gold/20 hover:text-gold transition-colors font-rajdhani text-sm uppercase tracking-wider text-white">
                ${s.title[currentLang]}
            </button>
        `).join('');

        const main = document.getElementById('main-content');
        const sectionsHTML = menuData.map((section, idx) => {
            
            const renderItem = (item) => {
                if(item.isSubtitle) {
                    return `<h3 class="font-cinzel text-xl text-gold mt-12 mb-6 tracking-widest text-center uppercase border-b border-gray-200/50 pb-4 inline-block mx-auto">${item.name[currentLang]}</h3>`;
                }

                return `
                <div class="py-6 border-b border-gray-100 hover:bg-gray-50/50 last:border-0 group transition-colors px-4 -mx-4 rounded-xl w-full">
                    <div class="flex justify-between items-baseline gap-4 mb-2">
                        <h3 class="font-cinzel text-xl text-ink group-hover:text-gold-dark font-extrabold transition-colors tracking-wide">
                            ${item.name[currentLang]}
                        </h3>
                        <span class="font-rajdhani font-bold text-gold-dark text-lg whitespace-nowrap">
                            ${item.price}
                        </span>
                    </div>
                    ${item.desc[currentLang] ? `<p class="font-rajdhani text-gray-500 text-base leading-relaxed max-w-3xl">${item.desc[currentLang]}</p>` : ''}
                </div>`;
            };

            return `
            <section id="${section.id}" class="mb-0 w-full bg-white relative">
                <div class="w-full h-[50vh] md:h-[70vh] relative flex items-center justify-center overflow-hidden bg-ink">
                    <div class="absolute inset-0 z-20"></div>
                    <div class="absolute inset-0 parallax-bg" style="background-image: url('${section.img}')"></div>
                    <div class="absolute inset-0 bg-black/50 pointer-events-none"></div>
                    
                    <div class="relative z-30 text-center text-white px-4">
                        <span class="block font-cinzel text-gold text-lg md:text-xl tracking-[0.4em] mb-4">${idx < 9 ? '0' : ''}${idx + 1}</span>
                        <h2 class="font-cinzel text-5xl md:text-7xl font-bold tracking-widest uppercase mb-6 drop-shadow-lg">
                            ${section.title[currentLang]}
                        </h2>
                        <p class="font-rajdhani text-lg md:text-2xl max-w-2xl mx-auto text-gray-200 font-light">
                            ${section.desc[currentLang]}
                        </p>
                    </div>
                </div>

                <div class="max-w-4xl mx-auto px-6 py-20 md:py-24 bg-white relative -mt-10 rounded-t-3xl shadow-[0_-20px_60px_-15px_rgba(0,0,0,0.1)] z-20 flex flex-col items-center">
                    <div class="flex flex-col w-full">
                        ${section.items.map(item => renderItem(item)).join('')}
                    </div>
                </div>
            </section>
            `;
        }).join('');

        const infoHTML = `
          <div class="bg-alabaster border-t border-gray-200 py-16 px-6 relative z-30">
              <div class="max-w-3xl mx-auto text-center">
                  <h4 class="font-cinzel text-gold-dark text-lg mb-4 tracking-widest uppercase">
                      ${ALLERGIES.title[currentLang]}
                  </h4>
                  <p class="font-rajdhani text-gray-600 text-sm leading-7 mb-8">
                      ${ALLERGIES.text[currentLang]}
                  </p>
              </div>
          </div>
        `;
      
        main.innerHTML = sectionsHTML + infoHTML;
    }
    })();
  </script>
